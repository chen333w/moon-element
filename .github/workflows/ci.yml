name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Version
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check all backends
        run: moon check --target all --deny-warn

      - name: Test all backends
        run: moon test --target all --deny-warn

      # The conformance evidence: Python's sqlite3 creates the databases, our reader
      # dumps them, and every row and value is compared.
      - name: Differential conformance against SQLite
        run: python3 tools/verify_sqlite.py
