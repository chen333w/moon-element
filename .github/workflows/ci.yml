# MoonBit 项目的 CI 门禁。
# 结构参照官方 starter 模板（moonbit-community/starter）的 check.yml，
# 动作版本固定到 commit SHA，避免上游 tag 漂移。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # js 后端的测试需要一个 JS 运行时。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Toolchain version
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check all backends
        run: moon check --target all --deny-warn

      # 公开接口（.mbti）必须与源码一致且已提交，防止接口悄悄漂移。
      - name: Check public interfaces
        run: |
          moon info --target all
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- '*.mbti')"

      - name: Test all backends
        run: moon test --target all --deny-warn

      # 生成器漂移检查：仓库里的示例必须与 CLI 当前产出完全一致。
      # 改了生成器却忘记重新生成示例，这一步会红。
      - name: "CLI: generated skeleton matches committed example"
        run: |
          moon run cmd/main -- x-counter > /tmp/generated-component.mbt
          diff -u examples/generated-x-counter/component.mbt /tmp/generated-component.mbt
          moon run cmd/main -- x-light-panel --mode light > /tmp/generated-light.mbt
          diff -u examples/generated-light-panel/component.mbt /tmp/generated-light.mbt

      # 构建 demo 产物并在 node 里验证它真的能跑（D0 假设 3 的持续验证）。
      - name: Build demo and verify the artifact headlessly
        run: |
          moon build --target js --release
          node examples/demo/verify.mjs

      # 覆盖率目前只作参考（CLI 入口与示例的运行路径不在单元测试覆盖范围内）。
      - name: Coverage (js, informational)
        run: |
          moon test --target js --enable-coverage
          moon coverage report -f summary